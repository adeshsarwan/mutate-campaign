name: Google Ads Media

on:
  push:
    paths:
      - 'media-requests/**.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Path to a media request JSON file'
        required: true
        type: string

jobs:
  media:
    runs-on: ubuntu-latest
    environment: google.env
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_ALLOWED_CUSTOMER_IDS: ${{ vars.GOOGLE_ADS_ALLOWED_CUSTOMER_IDS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve media requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST="${{ inputs.request_file }}"
            case "$REQUEST" in
              media-requests/*.json) ;;
              *) echo "request_file must be under media-requests/ and end in .json" >&2; exit 1 ;;
            esac
            test -f "$REQUEST"
            printf '%s\n' "$REQUEST" > /tmp/media-request-files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^media-requests/.*\.json$' > /tmp/media-request-files.txt || true
          fi
          if [ ! -s /tmp/media-request-files.txt ]; then
            echo "No media request files found."
            exit 1
          fi
          cat /tmp/media-request-files.txt

      - name: Extract requested media package
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(head -n 1 /tmp/media-request-files.txt)"
          PACKAGE="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("package_file") or "dotconnect-mania-approved-google-ads.zip")' "$REQUEST")"
          case "$PACKAGE" in
            *.zip) ;;
            *) echo "package_file must be a repository ZIP file" >&2; exit 1 ;;
          esac
          case "$PACKAGE" in
            /*|*..*) echo "Unsafe package_file: $PACKAGE" >&2; exit 1 ;;
          esac
          test -f "$PACKAGE"
          rm -rf media/dot-connect
          mkdir -p media/dot-connect/package
          unzip -q "$PACKAGE" -d media/dot-connect/package
          echo "Using package: $PACKAGE"
          echo "Extracted files:"
          find media/dot-connect/package -type f | sort

      - name: Execute media requests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r REQUEST; do
            BASENAME="$(basename "$REQUEST" .json)"
            OPERATION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["operation"])' "$REQUEST")"
            case "$OPERATION" in
              inspect_app_campaign_assets|attach_app_campaign_assets|create_replacement_app_ad_group)
                python src/creative_attach.py "$REQUEST" "results/${BASENAME}.result.json"
                ;;
              *)
                python src/media_upload.py "$REQUEST" "results/${BASENAME}.result.json"
                ;;
            esac
          done < /tmp/media-request-files.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-media-results-${{ github.run_id }}
          path: results/
          if-no-files-found: error
